# SPDX-License-Identifier: MPL-2.0
name: CI
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: CI/gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify refusal controls
        run: bash tests/workflows/ci_gate_test.sh
      - name: Require actual workflow successes at this revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_EVENT: ${{ github.event_name }}
        run: bash scripts/check-ci-gate.sh
