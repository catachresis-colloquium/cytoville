# SPDX-License-Identifier: AGPL-3.0-or-later
name: Production resource proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creusot-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  budget:
    uses: hyperpolymath/cicd-suite/.github/workflows/creusot-gate.yml@1084f47cc64090a7acc5f719a65fec48c1705e06
    with:
      working_directory: crates/cytoville-budget
      creusot_version: "0.14.0"
      rust_nightly: "nightly-2026-08-03"
      enforce_hollow: true
  acceptance:
    name: Production resource proof acceptance
    needs: budget
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful shared proof verdict
        env:
          PROOF_RESULT: ${{ needs.budget.result }}
        run: test "$PROOF_RESULT" = success
# Provisioning deviation: the shared gate installs the pinned upstream proof
# tools outside Guix. Scope and closure are recorded in PROOF-STATUS.adoc.
