# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Rust CI — compiles standalone scripts/*.rs utilities with -D warnings and
# runs cargo check/test/clippy when a Cargo.toml is present.
name: Rust CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows Rust and Zig runtime boundary
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install pinned Windows native tools
        shell: pwsh
        run: ./scripts/install-ci-native-windows.ps1

      - name: Exercise the native kernel through Rust on Windows
        shell: pwsh
        run: cargo test -p cytoville-runtime --release --test runtime --locked

  acceptance:
    needs: windows-native
    uses: ./.github/workflows/e2e.yml

  rust-ci:
    name: Rust standalone tools and workspace gate
    needs: [windows-native, acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both native platforms and complete acceptance
        env:
          WINDOWS_RESULT: ${{ needs.windows-native.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$WINDOWS_RESULT" = success && test "$ACCEPTANCE_RESULT" = success
